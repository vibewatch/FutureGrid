name: Scheduled data refresh

# Recurring refresh of committed data snapshots driven by scripts/refresh-data.mjs.
# The orchestrator runs every public, key-free builder in dependency order.
# Each builder's validate*() gate throws on degenerate data — a failing job
# indicates a bad upstream fetch, not a code regression.
#
# On success, changed snapshots are proposed as a PR against main.
# If nothing changed, the job succeeds cleanly without creating an empty commit.
#
# Credential-gated builders are EXCLUDED from the orchestrator:
#   jolts            — requires BLS_API_KEY
#   onet-enrichment  — requires ONET_API_KEY
#   h1b-trends       — no credential but ~2 GB Internet Archive downloads
#   occupation-snapshot — requires BLS_API_KEY for OEWS employment enrichment;
#                         without it employment: null overwrites canonical data
# Wisconsin WARN requires GOOGLE_SHEETS_API_KEY; the builder preserves the
# last-known-good WI records when the key is absent (no records are dropped).

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh-data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Yahoo Finance unofficial chart bootstrap — enables real stock refresh
      # without ALPHA_VANTAGE_API_KEY. Safe to expose as a plain env var.
      AI_COMPANY_STOCKS_BOOTSTRAP_YAHOO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh all key-free datasets
        # GOOGLE_SHEETS_API_KEY is optional; build-warn.mjs preserves last-known-good
        # WI records when absent. Do NOT add credential-gated builders here; edit
        # scripts/refresh-data.mjs MANIFEST instead.
        # build-data-snapshot.mjs is intentionally EXCLUDED from the manifest (requires
        # BLS_API_KEY; without it writes employment: null, overwriting canonical OEWS data).
        env:
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
        run: npm run data:refresh

      - name: Run provenance and data-schema tests
        run: npm run test:run -- tests/provenance.test.ts tests/data-schema.test.ts tests/refresh-manifest.test.ts

      - name: Detect changed data files
        id: diff
        run: |
          if git diff --quiet HEAD -- data/ public/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data files changed — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --name-only HEAD -- data/ public/
          fi

      - name: Commit and push to automation branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="data/scheduled-refresh"
          git checkout -B "$BRANCH"
          git add data/ public/
          DATESTAMP=$(date -u +%Y-%m-%d)
          git commit -F - <<EOF
          chore(data): scheduled snapshot refresh ${DATESTAMP}

          Auto-generated by .github/workflows/refresh-data.yml (npm run data:refresh).
          Key-free public-source builders only; credential-gated datasets unchanged.

          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          EOF
          git push -f origin "$BRANCH"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="data/scheduled-refresh"
          DATESTAMP=$(date -u +%Y-%m-%d)
          CHANGED_FILES=$(git diff origin/main...HEAD --name-only -- data/ public/ | head -40)

          PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "Updating existing PR #${PR_NUMBER} — branch already pushed above."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(data): scheduled snapshot refresh ${DATESTAMP}" \
              --body-file - <<EOF
          ## Scheduled Data Refresh — ${DATESTAMP}

          Automated weekly refresh via \`npm run data:refresh\` ([scripts/refresh-data.mjs](../../blob/main/scripts/refresh-data.mjs)).

          All builders pass their \`validate*()\` gate before writing. Provenance updated in \`data/provenance.json\`.

          ### Changed files
          \`\`\`
          ${CHANGED_FILES}
          \`\`\`

          ### Credential-gated datasets (unchanged)
          - \`jolts.json\` — requires \`BLS_API_KEY\`
          - \`onet-enrichment.json\` — requires \`ONET_API_KEY\`
          - \`h1b-trends.json\` — large Internet Archive download (not safe for weekly CI)
          - \`occupation-snapshot.json\` — requires \`BLS_API_KEY\` for OEWS employment enrichment; excluded to prevent employment: null overwrite
          - \`warn-notices.json / WI\` — requires \`GOOGLE_SHEETS_API_KEY\` (last-known-good WI records preserved when key absent)

          ---
          *Do not merge — awaiting review.*
          EOF
            echo "PR created."
          fi

